<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#5cb8ff" />
<meta name="description" content="Jump Hero — a 2D platformer with three levels, lives, a score leaderboard and CC0 art." />
<title>Jump Hero</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Game canvas"></canvas>

  <div id="loader" class="overlay">
    <h1 class="title">Jump Hero</h1>
    <p>Loading…</p>
  </div>

  <header id="hud" hidden>
    <div class="hud-block"><span class="hud-label">Lives</span><span id="hud-lives">× 3</span></div>
    <div class="hud-block"><span class="hud-label">Coins</span><span id="hud-coins">× 00</span></div>
    <div class="hud-block hud-level"><span class="hud-label">Level</span><span id="hud-level"></span></div>
    <div class="hud-block"><span class="hud-label">Score</span><span id="hud-score">0</span></div>
    <div class="hud-block"><span class="hud-label">Time</span><span id="hud-time">000</span></div>
    <button id="mute-btn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  </header>

  <section id="menu" class="overlay" hidden>
    <div class="menu-card">
      <h1 class="title">Jump Hero</h1>
      <p class="tagline">Run, jump, stomp. Clear all three levels.</p>
      <label class="field">
        <span>Player name</span>
        <input id="player-name" type="text" maxlength="16" autocomplete="nickname" placeholder="e.g. Ravi" />
      </label>
      <div class="menu-grid">
        <div>
          <h2>Levels</h2>
          <div id="level-list" class="level-list"></div>
        </div>
        <div>
          <h2 id="board-title">Leaderboard</h2>
          <ol id="leaderboard" class="board"></ol>
        </div>
      </div>
      <button id="play-btn" class="btn primary big" type="button" disabled>Play</button>
      <p class="help">Keys: ← → move · Shift / X run · Space / ↑ / Z jump · P / Esc pause · M mute</p>
    </div>
  </section>

  <section id="pause" class="overlay" hidden>
    <div class="card">
      <h2>Paused</h2>
      <button id="resume-btn" class="btn primary" type="button">Resume</button>
      <button id="pause-menu-btn" class="btn" type="button">Quit to menu</button>
    </div>
  </section>

  <section id="clear" class="overlay" hidden>
    <div class="card">
      <h2 id="clear-title">Level cleared!</h2>
      <div id="clear-stats" class="stats"></div>
      <button id="next-btn" class="btn primary" type="button">Next</button>
      <button id="clear-menu-btn" class="btn" type="button">Back to menu</button>
    </div>
  </section>

  <section id="life-lost" class="overlay small" hidden>
    <div class="card">
      <h2>Oops!</h2>
      <p class="ll-text"></p>
    </div>
  </section>

  <section id="gameover" class="overlay" hidden>
    <div class="card">
      <h2>Game over</h2>
      <div id="gameover-stats" class="stats"></div>
      <button id="retry-btn" class="btn primary" type="button">Play again</button>
      <button id="gameover-menu-btn" class="btn" type="button">Back to menu</button>
    </div>
  </section>

  <div id="toast" role="status" hidden></div>

  <div id="touch" class="touch" hidden>
    <div class="touch-left">
      <button class="tbtn" type="button" data-action="left" aria-label="Left">◀</button>
      <button class="tbtn" type="button" data-action="right" aria-label="Right">▶</button>
    </div>
    <div class="touch-right">
      <button class="tbtn small" type="button" data-action="pause" aria-label="Pause">II</button>
      <button class="tbtn" type="button" data-action="run" aria-label="Run">RUN</button>
      <button class="tbtn jump" type="button" data-action="jump" aria-label="Jump">JUMP</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
